openapi: 3.0.3
info:
  title: CloseAndKeep Orders
  version: "1.0"
  description: >
    Create prospects and gift orders. Humans complete Stripe Checkout when
    checkout_url is returned. Never send card numbers.
servers:
  - url: https://api.closeandkeep.com
paths:
  /gifts:
    get:
      operationId: listGifts
      summary: List cookie packs and prices
      responses:
        "200":
          description: Catalog
  /prospects:
    get:
      operationId: listProspects
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Owned prospects
    post:
      operationId: createProspect
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                deal_status:
                  type: string
                  enum: [open, won, lost]
                  default: open
      responses:
        "201":
          description: Created prospect
  /gift-orders:
    get:
      operationId: listGiftOrders
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Owned gift orders
    post:
      operationId: createGiftOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GiftOrderCreate"
      responses:
        "201":
          description: Created order (may include checkout_url)
  /gift-orders/{order_id}:
    get:
      operationId: getGiftOrder
      security:
        - bearerAuth: []
      parameters:
        - name: order_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Gift order
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: cak_
  schemas:
    GiftOrderCreate:
      type: object
      required: [prospect_id, gift_id, recipient_name, note]
      properties:
        prospect_id:
          type: integer
        gift_id:
          type: string
          enum: [cookies-4, cookies-12]
        recipient_name:
          type: string
        shipping_company:
          type: string
        shipping_street:
          type: string
        shipping_street2:
          type: string
        shipping_city:
          type: string
        shipping_state:
          type: string
        shipping_postal_code:
          type: string
        note:
          type: string
          maxLength: 150
        request_recipient_address:
          type: boolean
          default: false
        recipient_email:
          type: string
          format: email
